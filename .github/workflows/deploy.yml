name: Build & Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # 1. Create app directory if not exists
            mkdir -p ~/moneytracker
            cd ~/moneytracker

            # 2. Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # 3. Create or update .env file
            cat << 'EOF' > .env
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            NODE_ENV=production
            PORT=3000
            EOF

            # 4. Create or update docker-compose.yml
            cat << 'EOF' > docker-compose.yml
            services:
              moneytracker:
                image: ghcr.io/${{ github.repository }}:latest
                container_name: moneytracker-app
                restart: always
                ports:
                  - "3000:3000"
                env_file:
                  - .env
                environment:
                  - NODE_ENV=production
                  - DATABASE_URL=${DATABASE_URL}
                  - PORT=3000
                healthcheck:
                  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 10s
            EOF

            # 5. Pull latest image and restart container
            docker compose pull
            docker compose up -d --remove-orphans

            # 6. Clean up old unused images
            docker image prune -f
